<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Kombat FLOW - Tactical Arena</title>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Kombat%20FLOW%22,%22short_name%22:%22KombatFLOW%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22}">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            font-family: 'Arial Black', -apple-system, sans-serif;
        }

        /* Mirilla Táctica Estilo CoD */
        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 24px; height: 24px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }
        #crosshair::before, #crosshair::after {
            content: ''; position: absolute; background: rgba(56, 189, 248, 0.9);
            box-shadow: 0 0 4px #000;
        }
        #crosshair::before { top: 11px; left: 0; width: 24px; height: 2px; }
        #crosshair::after { top: 0; left: 11px; width: 2px; height: 24px; }

        /* HUD Táctico */
        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; pointer-events: none;
        }
        .hud-card {
            background: rgba(0, 0, 0, 0.65);
            border-left: 4px solid #38bdf8;
            padding: 8px 16px; color: #fff;
            backdrop-filter: blur(8px);
            font-size: 0.9rem;
        }
        .hp-bar-bg {
            width: 120px; height: 8px; background: #222;
            margin-top: 4px; border-radius: 4px; overflow: hidden;
        }
        .hp-bar-fill {
            width: 100%; height: 100%; background: #10b981;
            transition: width 0.2s ease;
        }

        /* Zona de Apuntado (Mover Cámara) */
        #aim-zone {
            position: absolute; inset: 0; z-index: 5;
        }

        /* Controles Táctiles */
        #joystick-zone {
            position: absolute; bottom: 30px; left: 30px;
            width: 110px; height: 110px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%; z-index: 10;
        }
        #joystick-knob {
            position: absolute; top: 35px; left: 35px;
            width: 40px; height: 40px; background: rgba(56, 189, 248, 0.8);
            border: 2px solid #fff; border-radius: 50%;
            pointer-events: none;
        }

        #action-zone {
            position: absolute; bottom: 30px; right: 30px;
            display: flex; gap: 15px; z-index: 10;
        }
        .btn-fire {
            width: 75px; height: 75px; border-radius: 50%;
            background: radial-gradient(circle, #ef4444 0%, #991b1b 100%);
            border: 2px solid #fff; color: #fff; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        #game-over {
            position: absolute; inset: 0; background: rgba(0,0,0,0.85);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; color: #fff;
        }
    </style>
</head>
<body>

    <!-- HUD -->
    <div id="crosshair"></div>
    <div id="hud">
        <div class="hud-card">
            <div style="color:#38bdf8; font-weight:bold;">KOMBAT FLOW</div>
            <div>SCORE: <span id="score" style="color:#fff;">0</span></div>
        </div>
        <div class="hud-card">
            <div>SALUD</div>
            <div class="hp-bar-bg"><div id="hp-bar" class="hp-bar-fill"></div></div>
        </div>
    </div>

    <!-- Touch Control Overlay -->
    <div id="aim-zone"></div>

    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <div id="action-zone">
        <div id="btn-fire" class="btn-fire">FIRE</div>
    </div>

    <div id="game-over">
        <h1 style="color:#ef4444;">MISIÓN FALLIDA</h1>
        <p>Puntuación Táctica: <span id="final-score">0</span></p>
        <button onclick="location.reload()" style="padding:10px 20px; background:#38bdf8; border:none; font-weight:bold; cursor:pointer;">REINTENTAR</button>
    </div>

    <!-- Three.js + Water Shader CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // Configuración Principal de Escena 3D Táctica
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0e17);
        scene.fog = new THREE.FogExp2(0x0a0e17, 0.015);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // Luces Tácticas PBR
        const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.8);
        sunLight.position.set(20, 40, 20);
        scene.add(sunLight);

        // AGUA FOTOREALISTA EN LA ARENA
        const waterGeo = new THREE.PlaneGeometry(100, 100, 32, 32);
        const waterMat = new THREE.MeshStandardMaterial({
            color: 0x0f2b46,
            roughness: 0.1,
            metalness: 0.8,
            transparent: true,
            opacity: 0.85
        });
        const water = new THREE.Mesh(waterGeo, waterMat);
        water.rotation.x = -Math.PI / 2;
        water.position.y = -0.1;
        scene.add(water);

        // Plataforma de Combate Metal/Hormigón
        const floorGeo = new THREE.BoxGeometry(40, 0.4, 40);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5, metalness: 0.5 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.position.y = -0.2;
        scene.add(floor);

        // JUGADOR Y ARMA TÁCTICA (Estilo CoD 007)
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // Rig del Arma (Arma Táctica Metálica)
        const weaponGroup = new THREE.Group();
        
        // Cuerpo del Fusil
        const gunBodyGeo = new THREE.BoxGeometry(0.12, 0.18, 0.9);
        const gunMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.2, metalness: 0.9 });
        const gunBody = new THREE.Mesh(gunBodyGeo, gunMat);
        weaponGroup.add(gunBody);

        // Cañón Metálico
        const barrelGeo = new THREE.CylinderGeometry(0.03, 0.03, 0.5);
        const barrelMat = new THREE.MeshStandardMaterial({ color: 0x374151, metalness: 0.95, roughness: 0.1 });
        const barrel = new THREE.Mesh(barrelGeo, barrelMat);
        barrel.rotation.x = Math.PI / 2;
        barrel.position.set(0, 0.04, -0.6);
        weaponGroup.add(barrel);

        // Mira Réflex Táctica (ADS)
        const scopeGeo = new THREE.BoxGeometry(0.08, 0.08, 0.15);
        const scopeMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, metalness: 0.8, roughness: 0.2 });
        const scope = new THREE.Mesh(scopeGeo, scopeMat);
        scope.position.set(0, 0.12, -0.1);
        weaponGroup.add(scope);

        // Fogonazo (Muzzle Flash)
        const flashGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const flashMat = new THREE.MeshBasicMaterial({ color: 0xfde047, visible: false });
        const muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
        muzzleFlash.position.set(0, 0.04, -0.9);
        weaponGroup.add(muzzleFlash);

        // Posicionar el arma respecto a la cámara (Tercera persona pegada al hombro)
        weaponGroup.position.set(0.35, -0.25, -0.5);
        camera.add(weaponGroup);
        scene.add(camera);

        // Variables de Estado
        let score = 0;
        let hp = 100;
        let isGameOver = false;
        let yaw = 0, pitch = 0;
        const enemies = [];
        const bullets = [];

        // Lógica de Apuntado (Touch Look estilo Shooter Móvil)
        let lastTouchX = 0, lastTouchY = 0;
        const aimZone = document.getElementById('aim-zone');

        aimZone.addEventListener('touchstart', e => {
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
        });

        aimZone.addEventListener('touchmove', e => {
            if (isGameOver) return;
            const touch = e.touches[0];
            const dx = touch.clientX - lastTouchX;
            const dy = touch.clientY - lastTouchY;

            yaw -= dx * 0.005;
            pitch -= dy * 0.005;
            pitch = Math.max(-0.6, Math.min(0.6, pitch)); // Límite vertical

            lastTouchX = touch.clientX;
            lastTouchY = touch.clientY;
        });

        // Joystick de Movimiento
        const jZone = document.getElementById('joystick-zone');
        const jKnob = document.getElementById('joystick-knob');
        let moveVector = { x: 0, z: 0 };
        let jActive = false, jTouchId = null;

        jZone.addEventListener('touchstart', e => {
            jActive = true; jTouchId = e.changedTouches[0].identifier;
            updateJ(e.changedTouches[0]);
        });
        window.addEventListener('touchmove', e => {
            if (!jActive) return;
            for (let t of e.changedTouches) if (t.identifier === jTouchId) updateJ(t);
        });
        window.addEventListener('touchend', e => {
            if (!jActive) return;
            for (let t of e.changedTouches) {
                if (t.identifier === jTouchId) {
                    jActive = false; jKnob.style.transform = 'translate(0,0)';
                    moveVector = { x: 0, z: 0 };
                }
            }
        });

        function updateJ(touch) {
            const r = jZone.getBoundingClientRect();
            const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
            let dx = touch.clientX - cx, dy = touch.clientY - cy;
            const dist = Math.hypot(dx, dy), maxD = 35;
            if (dist > maxD) { dx = (dx/dist)*maxD; dy = (dy/dist)*maxD; }
            jKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            moveVector.x = dx / maxD; moveVector.z = dy / maxD;
        }

        // Disparo Realista con Recoil
        function fireWeapon() {
            if (isGameOver) return;

            // Animación Recoil (Retroceso)
            weaponGroup.position.z += 0.08;
            weaponGroup.rotation.x += 0.05;
            muzzleFlash.material.visible = true;

            setTimeout(() => {
                weaponGroup.position.z = -0.5;
                weaponGroup.rotation.x = 0;
                muzzleFlash.material.visible = false;
            }, 60);

            // Crear Proyectil Táctico
            const bGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const bMat = new THREE.MeshBasicMaterial({ color: 0xfeb2b2 });
            const bullet = new THREE.Mesh(bGeo, bMat);

            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            bullet.position.copy(camera.position).addScaledVector(dir, 0.8);
            bullet.userData = { dir: dir, speed: 1.2, life: 50 };

            scene.add(bullet);
            bullets.push(bullet);
        }

        document.getElementById('btn-fire').addEventListener('click', fireWeapon);

        // Generar Enemigos Tácticos (Soldados Dron)
        function spawnEnemy() {
            if (isGameOver) return;
            const enemy = new THREE.Group();
            
            const bodyG = new THREE.CylinderGeometry(0.4, 0.4, 1.6, 8);
            const bodyM = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.3, metalness: 0.7 });
            const mesh = new THREE.Mesh(bodyG, bodyM);
            mesh.position.y = 0.8;
            enemy.add(mesh);

            const angle = Math.random() * Math.PI * 2;
            const dist = 18 + Math.random() * 6;
            enemy.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist);

            scene.add(enemy);
            enemies.push(enemy);
        }

        setInterval(spawnEnemy, 2000);

        // Loop de Renderizado
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            if (isGameOver) return;

            const delta = clock.getDelta();

            // Animación suave del agua
            waterMat.opacity = 0.8 + Math.sin(clock.getElapsedTime() * 2) * 0.05;

            // Orientar Cámara / Rotaciones
            playerGroup.rotation.y = yaw;
            camera.rotation.set(pitch, yaw, 0, 'YXZ');

            // Movimiento relativo al ángulo de visión
            if (Math.hypot(moveVector.x, moveVector.z) > 0.1) {
                const moveDir = new THREE.Vector3(moveVector.x, 0, moveVector.z).normalize();
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                playerGroup.position.addScaledVector(moveDir, 0.12);
            }

            // Fijar posición de la cámara estilo 007 / CoD
            camera.position.copy(playerGroup.position).add(new THREE.Vector3(0, 1.4, 0));

            // Actualizar Balas
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.addScaledVector(b.userData.dir, b.userData.speed);
                b.userData.life--;

                if (b.userData.life <= 0) {
                    scene.remove(b); bullets.splice(i, 1);
                }
            }

            // Actualizar Enemigos
            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                const dir = new THREE.Vector3().subVectors(playerGroup.position, enemy.position).normalize();
                enemy.position.addScaledVector(dir, 0.05);

                // Colisión Bala vs Enemigo
                for (let j = bullets.length - 1; j >= 0; j--) {
                    if (enemy.position.distanceTo(bullets[j].position) < 0.9) {
                        scene.remove(enemy); scene.remove(bullets[j]);
                        enemies.splice(i, 1); bullets.splice(j, 1);
                        score += 25;
                        document.getElementById('score').innerText = score;
                        break;
                    }
                }

                // Daño al Jugador
                if (enemy && enemy.position.distanceTo(playerGroup.position) < 1.2) {
                    hp -= 10;
                    document.getElementById('hp-bar').style.width = Math.max(0, hp) + '%';
                    scene.remove(enemy); enemies.splice(i, 1);
                    if (hp <= 0) {
                        isGameOver = true;
                        document.getElementById('final-score').innerText = score;
                        document.getElementById('game-over').style.display = 'flex';
                    }
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
